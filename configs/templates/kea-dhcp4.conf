// =============================================================================
// CRYPTSK Kea DHCPv4 Server Configuration
// Location: /etc/kea/kea-dhcp4.conf
// =============================================================================

{
"Dhcp4": {

    // --- Server Identification ---
    "server-tag": "cryptsk-dhcp4",
    "server-hostname": "{{HOSTNAME}}",

    // --- Interfaces ---
    "interfaces-config": {
        "interfaces": ["{{DHCP_INTERFACE}}"],
        "dhcp-socket-type": "raw",
        "outbound-interface": "{{DHCP_INTERFACE}}"
    },

    // --- Lease Database (MySQL) ---
    "lease-database": {
        "type": "mysql",
        "name": "{{MYSQL_HOST}}",
        "user": "{{MYSQL_USER}}",
        "password": "{{MYSQL_PASSWORD}}",
        "port": {{MYSQL_PORT}},
        "database": "{{MYSQL_DATABASE}}",
        "connect-timeout": 10,
        "max-reconnect-tries": 5,
        "reconnect-wait-time": 3
    },

    // --- MySQL Host Reservation Database ---
    "hosts-database": {
        "type": "mysql",
        "name": "{{MYSQL_HOST}}",
        "user": "{{MYSQL_USER}}",
        "password": "{{MYSQL_PASSWORD}}",
        "port": {{MYSQL_PORT}},
        "database": "{{MYSQL_DATABASE}}"
    },

    // --- Backup Lease Database (fallback to SQLite) ---
    // Uncomment to use SQLite instead of MySQL:
    // "lease-database": {
    //     "type": "memfile",
    //     "persist": true,
    //     "name": "/var/lib/kea/kea-leases.csv",
    //     "lfc-interval": 3600
    // },

    // --- Expired Lease Processing ---
    "expired-leases-processing": {
        "reclaim-timer-wait-time": 10,
        "flush-reclaimed-timer-wait-time": 25,
        "hold-reclaimed-time": 3600,
        "max-reclaim-leases": 100,
        "max-reclaim-time": 25,
        "unwarned-reclaim-cycles": 5
    },

    // --- DHCPv4 Subnets ---
    "subnet4": [
        {
            "id": 1,
            "subnet": "{{DHCP_SUBNET}}",
            "pools": [
                {
                    "pool": "{{DHCP_POOL_START}} - {{DHCP_POOL_END}}"
                }
            ],
            "option-data": [
                {
                    "name": "routers",
                    "data": "{{GATEWAY_IP}}"
                },
                {
                    "name": "domain-name-servers",
                    "data": "{{DNS_SERVERS}}"
                },
                {
                    "name": "domain-name",
                    "data": "{{DNS_DOMAIN}}"
                },
                {
                    "name": "lease-time",
                    "data": {{DHCP_LEASE_TIME}}
                },
                {
                    "name": "broadcast-address",
                    "data": "{{BROADCAST_ADDR}}"
                }
            ],
            "valid-lifetime": {{DHCP_LEASE_TIME}},
            "max-valid-lifetime": {{DHCP_MAX_LEASE_TIME}},
            "min-valid-lifetime": 300,
            "reservations-global": false
        }
    ],

    // --- Global Host Reservations (MAC-based) ---
    // "reservations": [
    //     {
    //         "hw-address": "00:11:22:33:44:55",
    //         "ip-address": "192.168.1.100",
    //         "hostname": "special-device"
    //     }
    // ],

    // --- DHCP Hooks Libraries ---
    "hooks-libraries": [
        {
            "library": "/usr/lib/kea/hooks/libdhcp_lease_cmds.so"
        },
        {
            "library": "/usr/lib/kea/hooks/libdhcp_host_cmds.so"
        },
        {
            "library": "/usr/lib/kea/hooks/libdhcp_stat_cmds.so"
        }
    ],

    // --- Control Socket (for kea-ctrl-agent REST API) ---
    "control-socket": {
        "socket-type": "unix",
        "socket-name": "/run/kea/kea-dhcp4-ctrl.sock"
    },

    // --- Logging ---
    "loggers": [
        {
            "name": "kea-dhcp4",
            "output_options": [
                {
                    "output": "/var/log/kea/kea-dhcp4.log",
                    "maxsize": 10485760,
                    "maxver": 3
                }
            ],
            "severity": "INFO",
            "debuglevel": 0
        },
        {
            "name": "kea-dhcp4.hosts",
            "severity": "INFO",
            "debuglevel": 0
        },
        {
            "name": "kea-dhcp4.queries",
            "severity": "INFO",
            "debuglevel": 0
        }
    ]
}

}
