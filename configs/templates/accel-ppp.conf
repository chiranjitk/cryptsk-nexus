# =============================================================================
# CRYPTSK accel-ppp Main Configuration
# Location: /etc/accel-ppp/accel-ppp.conf
# =============================================================================

[modules]
# --- Authentication ---
auth
# --- Protocols ---
chap-secrets
# --- PPPoE ---
pppoe
# --- IP Management ---
ippool
# --- Traffic Shaping ---
shaper
# --- RADIUS Integration ---
radius
# --- Session Management ---
logwtmp
# --- Connection Tracking ---
connlimit

[core]
log-error=/var/log/accel-ppp/core.log
log-debug=/var/log/accel-ppp/debug.log
thread-count=4

[ppp]
verbose=1
min-mtu=1280
mtu=1492
mru=1492
# CCP (Compression Control Protocol) disabled for performance
ccp=0
# LCP echo for dead link detection
lcp-echo-interval=30
lcp-echo-failure=3
# Idle timeout (seconds, 0 = disabled)
idle-timeout=0
# Session timeout (seconds, 0 = disabled)
session-timeout=0
# Check IP address uniqueness
check-ip=1
# Single session per username
single-session=replace
# IP-up script for custom actions
# ip-up=/etc/accel-ppp/ip-up.sh
# ip-down=/etc/accel-ppp/ip-down.sh

[dns]
# DNS servers to assign to PPPoE clients
dns1={{DNS_PRIMARY}}
dns2={{DNS_SECONDARY}}

[client-ip]
# IP pool for static client assignments from RADIUS
# RADIUS Framed-IP-Address takes priority
# If RADIUS does not assign IP, ippool assigns from range
nopeer=1

[ip-pool]
# Gateway IP for the pool
gw={{PPPOE_GATEWAY}}
# IP address ranges for PPPoE clients
{{PPPOE_IP_RANGES}}

[radius]
# RADIUS server configuration (see radius.conf)
# This section is minimal; full config in /etc/accel-ppp/radius.conf
# gw-ip-address is sent as NAS-IP-Address in RADIUS packets
gw-ip-address={{PPPOE_GATEWAY}}
# Acct-Interim-Interval for periodic accounting updates (seconds)
acct-interim-interval=600
# NAS identifier
nas-identifier={{NAS_IDENTIFIER}}
# NAS port type
nas-port-type=ethernet

[shaper]
# Traffic shaping using HTB (Hierarchical Token Bucket)
attr=Filter-Id
# Downstream shaping (client to server)
# attr-down=Shape-Bandwidth-Down
# Default rate when no attribute is returned
down-burst-factor=0.1
up-burst-factor=1.0
# Latency target (ms)
latency=50
# MTU for shaper
mtu=1492
# Rate limiting
rate-limit={{SHAPER_DEFAULT_RATE}}
# RADIUS vendor-specific attributes for per-user shaping
# vendor=CryptSK
# attr=Shape-Bandwidth

[pppoe]
# PPPoE interface and options (see pppoe.conf)
# Interface is configured in the pppoe.conf include

[connlimit]
# Limit concurrent connections per user/IP
limit=10
# Time window for burst connections (seconds)
burst=3

[log]
# Logging configuration
log-file=/var/log/accel-ppp/accel-ppp.log
log-level=3
# Per-session logging
log-tcp=0
log-packet=0

[cli]
# Control socket for accel-ppp CLI management
telnet=127.0.0.1,2000
# Password for CLI access (set to empty for no auth on localhost)
password={{CLI_PASSWORD}}
