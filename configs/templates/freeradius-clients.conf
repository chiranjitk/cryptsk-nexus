# =============================================================================
# CRYPTSK FreeRADIUS NAS Clients Configuration
# Location: /etc/cryptsk/freeradius-clients.conf
# =============================================================================

# --- NAS Client: Local accel-ppp ---
client localhost {
    ipaddr = 127.0.0.1
    secret = {{RADIUS_SHARED_SECRET}}
    shortname = accel-ppp-local
    nastype = other
}

