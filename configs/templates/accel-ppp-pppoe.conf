# =============================================================================
# CRYPTSK accel-ppp PPPoE Configuration
# Location: /etc/accel-ppp/pppoe.conf
# =============================================================================

[pppoe]
# --- Listening Interface ---
# The network interface for PPPoE discovery and session
interface={{PPPOE_INTERFACE}}

# --- AC-Name (Access Concentrator Name) ---
# Sent in PADO packets; identifies this PPPoE server
ac-name={{AC_NAME}}

# --- Service Name ---
# Advertised in PADO packets
service-name={{SERVICE_NAME}}

# --- PPPoE Options ---
# Accept sessions from any MAC (0) or require matching AC cookie
# pado-delay=0

# --- Session limits ---
# Maximum concurrent PPPoE sessions (0 = unlimited)
# sessions=0

# --- VLAN support ---
# If interface uses VLANs, specify VLAN interface names
# interface=eth0.100
# interface=eth0.200

# --- PADO Delay ---
# Delay PADO response (milliseconds); useful for multi-AC setups
# pado-delay=0

# --- Service Selection ---
# If enabled, only accept PADI with matching service-name
# strict-service-name=0

# --- MAC Address Filtering ---
# Allow/deny based on MAC
# mac-filter=/etc/accel-ppp/mac-filter.conf

# --- VLAN Delegation ---
# Insert VLAN tag for specific subscribers
# vlan-delegation=1
# start-vlan=100
# end-vlan=200

# --- PMTU Discovery ---
# Truncate packets exceeding MTU instead of fragmenting
# ifname-in-sid=0
