# =============================================================================
# CRYPTSK accel-ppp RADIUS Configuration
# Location: /etc/accel-ppp/radius.conf
# =============================================================================

[radius]
# --- RADIUS Authentication Server ---
server={{RADIUS_SERVER}}
# Authentication port
auth-port={{RADIUS_AUTH_PORT}}
# Accounting port
acct-port={{RADIUS_ACCT_PORT}}

# --- Shared Secret ---
# Must match the secret configured in FreeRADIUS clients.conf
secret={{RADIUS_SHARED_SECRET}}

# --- NAS Configuration ---
# NAS-Identifier sent in Access-Request and Accounting-Request
nas-identifier={{NAS_IDENTIFIER}}
# NAS-IP-Address (set in accel-ppp.conf via gw-ip-address)
# nas-ip-address={{NAS_IP_ADDRESS}}

# --- Timeout & Retries ---
# RADIUS request timeout (seconds)
timeout=3
# Number of retry attempts
retry=3
# Number of RADIUS servers for failover (1 = single server)
# servers=1

# --- Failover ---
# If primary RADIUS server is down, try secondary
# server2={{RADIUS_SERVER_BACKUP}}
# auth-port2={{RADIUS_AUTH_PORT}}
# acct-port2={{RADIUS_ACCT_PORT}}
# secret2={{RADIUS_SHARED_SECRET_BACKUP}}

# --- DAEMON Mode ---
# Run RADIUS client as daemon (persistent connection)
# daemon=0

# --- Accounting ---
# Enable interim accounting updates
acct-interim-interval=600
# Send accounting on/off packets
acct-on=1

# --- Session Management ---
# Attribute mapping for session control
# attr-detect-type=attr:Session-Timeout
# attr-map-session-timeout=Session-Timeout

# --- Attribute Assignment ---
# Map RADIUS attributes to PPP/IP parameters
# Frame-IP-Address -> assigned IP address
# Framed-IP-Netmask -> netmask
# Session-Timeout -> session timeout
# Idle-Timeout -> idle timeout

# --- Vendor-Specific Attributes ---
# For MikroTik, Cisco, etc.
# vendor-mikrotik=14988

# --- CoA (Change of Authorization) ---
# Enable CoA for dynamic session changes (disconnect, rate change)
# coa-server={{RADIUS_SERVER}}
# coa-port=3799
