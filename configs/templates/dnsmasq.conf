# =============================================================================
# CRYPTSK dnsmasq Configuration
# Location: /etc/dnsmasq.d/cryptsk.conf
# =============================================================================

# --- Listen Address ---
listen-address=127.0.0.1,{{DNS_LISTEN_ADDR}}

# --- Bind to interfaces only ---
bind-interfaces

# --- Do not read /etc/resolv.conf ---
no-resolv

# --- Do not read /etc/hosts ---
no-hosts
addn-hosts=/etc/dnsmasq.d/cryptsk-hosts.conf

# --- Upstream DNS Servers ---
server=1.1.1.1
server=8.8.8.8

# --- DNS Cache Size (entries) ---
cache-size=10000

# --- Minimum TTL for cached entries (seconds) ---
min-cache-ttl=300

# --- Maximum TTL for cached entries (seconds) ---
max-cache-ttl=86400

# --- Local DNS domain ---
domain={{DNS_DOMAIN}}

# --- Expand hosts ---
expand-hosts

# --- DHCP Range (if dnsmasq is used as DHCP server for small setups) ---
# dhcp-range={{DHCP_RANGE_START}},{{DHCP_RANGE_END}},{{DHCP_LEASE_TIME}}
# dhcp-option=option:router,{{GATEWAY_IP}}
# dhcp-option=option:dns-server,{{DNS_LISTEN_ADDR}}

# --- Logging ---
log-queries
log-facility=/var/log/dnsmasq.log
log-async=50

# --- Performance ---
dns-forward-max=1000
edns-packet-max=4096

# --- Security ---
stop-dns-reinject
bogus-priv
domain-needed
