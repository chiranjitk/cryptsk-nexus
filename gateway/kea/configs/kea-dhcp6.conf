{
  "Dhcp6": {
    "interfaces-config": {
      "interfaces": ["*"]
    },
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/kea-leases6.csv",
      "lfc-interval": 3600
    },
    "preferred-lifetime": 1800,
    "valid-lifetime": 3600,
    "renew-timer": 900,
    "rebind-timer": 1800,
    "subnet6": [
      {
        "subnet": "fd00::/64",
        "pools": [{ "pool": "fd00::100-fd00::200" }],
        "option-data": [
          { "name": "dns-servers", "data": "fd00::1" },
          { "name": "domain-search", "data": "cryptsk.local" }
        ]
      }
    ],
    "loggers": [
      {
        "name": "kea-dhcp6",
        "output_options": [
          {
            "output": "/var/log/kea/kea-dhcp6.log",
            "flush": true,
            "maxsize": 1048576,
            "maxver": 8
          }
        ],
        "severity": "INFO",
        "debuglevel": 0
      }
    ]
  }
}
