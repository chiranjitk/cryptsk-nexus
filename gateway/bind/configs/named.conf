// ============================================================
// CRYPTSK Nexus — BIND named.conf
// Per: docs/architecture/02_GATEWAY §34, Phase 8
// ============================================================

options {
    listen-on port 53 { any; };
    listen-on-v6 port 53 { any; };
    directory "/var/named";
    dump-file "/var/named/data/cache_dump.db";
    statistics-file "/var/named/data/named_stats.txt";
    memstatistics-file "/var/named/data/named_mem_stats.txt";
    recursing-file "/var/named/data/named.recursing";
    secroots-file "/var/named/data/named.secroots";
    
    allow-query { any; };
    allow-recursion { 10.0.0.0/8; fd00::/64; };
    
    // Forward to upstream DNS
    forwarders { 8.8.8.8; 8.8.4.4; };
    forward first;
    
    dnssec-validation yes;
    managed-keys-directory "/var/named/dynamic";
    
    pid-file "/run/named/named.pid";
    session-keyfile "/run/named/session.key";
};

// Logging
logging {
    channel default_debug {
        file "data/named.run";
        severity dynamic;
    };
};

// ─── Forward Zone: cryptsk.local ─────────────────────────────
zone "cryptsk.local" IN {
    type master;
    file "cryptsk.local.zone";
    allow-update { none; };
};

// ─── Reverse Zone: 10.0.0.0/24 ───────────────────────────────
zone "0.0.10.in-addr.arpa" IN {
    type master;
    file "10.0.0.zone";
    allow-update { none; };
};

// ─── Reverse Zone: fd00::/64 (IPv6) ─────────────────────────
zone "0.0.d.f.ip6.arpa" IN {
    type master;
    file "fd00.zone";
    allow-update { none; };
};

// ─── Includes ────────────────────────────────────────────────
include "/etc/named.rfc1912.zones";
include "/etc/named.root.key";
