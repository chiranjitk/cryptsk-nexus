# ─── 1. Interfaces ────────────────────────────────────────────
# Create sub-interfaces / VLAN interfaces
# create sub-interfaces GigabitEthernet0/0/0 100
# set interface state GigabitEthernet0/0/0 up

# ─── 2. IP Assignment ────────────────────────────────────────
# Assign IP addresses to interfaces
# set interface ip address GigabitEthernet0/0/0 10.0.0.1/24

# ─── 3. Routing ──────────────────────────────────────────────
# Default route
# ip route add 0.0.0.0/0 via 10.0.0.254 GigabitEthernet0/0/1

# ─── 4. NAT (subscriber → internet) ──────────────────────────
# nat44 add address 203.0.113.10 - 203.0.113.100
# nat44 enable GigabitEthernet0/0/1 (uplink)
# nat44 enable GigabitEthernet0/0/0 (subscriber)

# ─── 5. ACL (per-subscriber firewall rules) ─────────────────
# acl add index 0 ipv4 permit src 10.0.0.0/24 dst any
# acl add index 1 ipv4 deny src any dst 10.0.0.0/24
# acl interface add GigabitEthernet0/0/0 acl-index 0

# ─── 6. QoS (bandwidth enforcement) ──────────────────────────
# set policer classify-interface GigabitEthernet0/0/0
# policer add name bb-50mbps cir 50000000 eir 60000000
# classify policer add bb-50mbps ip4 any any

# ─── 7. PPPoE (if using PPPoE termination) ───────────────────
# pppoe enable GigabitEthernet0/0/0
# pppoe create session username subscriber123 password xxx

# ─── 8. VLAN/VRF ─────────────────────────────────────────────
# create vrf table 10
# set interface vrf GigabitEthernet0/0/0 10
