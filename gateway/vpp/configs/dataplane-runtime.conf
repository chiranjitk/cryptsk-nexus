# CRYPTSK Nexus — VPP Runtime Configuration (Dataplane)
# Per: docs/architecture/02_GATEWAY_ARCHITECTURE.md §29-32
#
# This file contains VPP CLI commands that configure the dataplane.
# Applied after VPP starts (via `vppctl -c /run/vpp/cli.sock exec` or GoVPP).
#
