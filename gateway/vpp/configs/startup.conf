# ============================================================
# CRYPTSK Nexus — VPP Startup Configuration
# Per: docs/architecture/02_ENTERPRISE_GATEWAY_ARCHITECTURE.md §90
#
# This file configures the VPP dataplane process.
# VPP runs with DPDK for kernel-bypass packet I/O.
#
# Prerequisites:
#   - DPDK installed + hugepages configured
#   - NIC bound to DPDK driver (uio_pci_generic or vfio-pci)
#   - Isolated CPU cores (isolcpus kernel parameter)
#
# Usage:
#   vpp -c /etc/vpp/startup.conf
# ============================================================

unix {
    # Path to VPP CLI socket
    cli-listen /run/vpp/cli.sock
    
    # Log file
    log /var/log/vpp/vpp.log
    
    # PID file
    pidfile /run/vpp/vpp.pid
    
    # Run in background
    nodaemon
    
    # Don't run interactive CLI
    interactive
    
    # GDB support (for debugging)
    # gdb-enable
}

# ─── DPDK (kernel-bypass packet I/O) ──────────────────────────
dpdk {
    # DPDK EAL core mask (which CPU cores VPP can use)
    # Hex bitmask: 0x03 = cores 0-1, 0x0F = cores 0-3
    coremask 0x0F
    
    # Number of RX/TX descriptors
    num-mbufs 128000
    num-mbuf-segments 8000
    
    # DPDK device binding (PCI addresses of NICs)
    # Use `lspci | grep -i ether` to find PCI addresses
    # dev 0000:01:00.0  # NIC 1 (subscriber traffic)
    # dev 0000:01:00.1  # NIC 2 (uplink)
    
    # Hugepage support
    no-tx-check
    
    # Enable multi-queue
    # dev 0000:01:00.0 { num-rx-queues 2 num-tx-queues 2 }
}

# ─── CPU (thread allocation) ──────────────────────────────────
cpu {
    # Main thread (control plane)
    main-core 0
    
    # Worker threads (dataplane)
    coremask-workers 0x0E  # cores 1-3
    
    # RX queue polling mode
    poll-sleep 0
    
    # No multi-thread (set to yes for production)
    # no-multi-thread
}

# ─── Memory ───────────────────────────────────────────────────
memory {
    # Hugepages (must be pre-allocated in /proc/meminfo)
    hugepage /dev/hugepages
    
    # Default session memory
    session-queue-memory 1024
}

# ─── Buffers ──────────────────────────────────────────────────
buffers {
    # Buffer size (default 2048 for standard MTU)
    buffers-per-numa 8192
    
    # Data size
    data-size 2048
}

# ─── Plugins ──────────────────────────────────────────────────
plugins {
    # Enable essential plugins for CRYPTSK Nexus
    plugin default { enable }
    plugin dpdk_plugin.so { enable }
    plugin nat_plugin.so { enable }
    plugin acl_plugin.so { enable }
    plugin qos_plugin.so { enable }
    plugin policer_plugin.so { enable }
    plugin ppoe_plugin.so { enable }
    
    # Disable unused plugins (saves memory)
    plugin lb_plugin.so { disable }
    plugin mactap_plugin.so { disable }
    plugin srv6ad_plugin.so { disable }
}

# ─── API (GoVPP binary API socket) ───────────────────────────
api {
    # Binary API socket (GoVPP adapter connects here)
    sock /run/vpp/api.sock
    
    # Default API queue length
    queue-length 1024
}

# ─── Stats (telemetry) ────────────────────────────────────────
stats {
    # Stats socket
    socket /run/vpp/stats.sock
    
    # Polling interval (seconds)
    interval 10
}
